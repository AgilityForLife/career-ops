# Portal Scanner Configuration — Erick G. Rosa
# Customized for: PM / Program Manager / Agile Coach / Scrum Master / Delivery Lead / AI-adjacent roles
# Last updated: 2026-04-06

title_filter:
  positive:
    # -- Project / Program Management --
    - "Project Manager"
    - "Program Manager"
    - "Technical Project Manager"
    - "Senior Project Manager"
    - "Project Coordinator"
    - "PMO"
    - "Portfolio Manager"
    - "Release Manager"
    - "Delivery Manager"
    - "Delivery Lead"
    # -- Agile / Scrum --
    - "Agile Coach"
    - "Scrum Master"
    - "SAFe"
    - "RTE"                    # Release Train Engineer
    - "Agile Program Manager"
    - "Agile Delivery"
    - "Product Owner"
    # -- AI-adjacent roles --
    - "AI Project Manager"
    - "AI Program Manager"
    - "AI Delivery"
    - "AI Transformation"
    - "Transformation Lead"
    - "Digital Transformation"
    - "Claude"
    - "Agentic"
    - "AI Coach"
    # -- Construction / Infrastructure PM (Procore certified) --
    - "Construction Project Manager"
    - "Infrastructure Project Manager"
  negative:
    - "Junior"
    - "Intern"
    - "Entry Level"
    - "Associate Project Manager"   # typically entry-level
    - "Java "
    - ".NET Developer"
    - "iOS"
    - "Android"
    - "PHP"
    - "Ruby"
    - "Blockchain"
    - "Web3"
    - "Crypto"
    - "COBOL"
    - "Mainframe"
    - "FPGA"
    - "ASIC"
  seniority_boost:
    - "Senior"
    - "Lead"
    - "Principal"
    - "Staff"
    - "Head"
    - "Director"
    - "VP"

# -- Search queries --
search_queries:

  # -- PM & Agile roles on major portals --
  - name: Greenhouse — Senior PM & Delivery Lead
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Technical Project Manager" OR "Program Manager" OR "Delivery Lead" remote OR "New Jersey" OR "New York"'
    enabled: true

  - name: Greenhouse — Agile Coach & Scrum Master
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "Agile Coach" OR "Scrum Master" OR "RTE" OR "Release Train Engineer" remote OR "New York"'
    enabled: true

  - name: Ashby — PM & Agile roles
    query: 'site:jobs.ashbyhq.com "Project Manager" OR "Agile Coach" OR "Scrum Master" OR "Delivery Lead" remote senior'
    enabled: true

  - name: Lever — PM & Program Manager
    query: 'site:jobs.lever.co "Senior Project Manager" OR "Program Manager" OR "Technical Project Manager" remote OR "New Jersey" OR "New York"'
    enabled: true

  - name: Lever — Agile Coach & Scrum Master
    query: 'site:jobs.lever.co "Agile Coach" OR "Scrum Master" OR "SAFe" OR "Agile Delivery" remote OR "New York"'
    enabled: true

  # -- AI PM / AI Transformation --
  - name: Greenhouse — AI PM & Transformation Lead
    query: 'site:boards.greenhouse.io OR site:job-boards.greenhouse.io "AI Project Manager" OR "AI Program Manager" OR "AI Transformation" OR "Digital Transformation" remote'
    enabled: true

  - name: Ashby — AI PM & Delivery
    query: 'site:jobs.ashbyhq.com "AI" "Project Manager" OR "Program Manager" OR "Delivery" remote'
    enabled: true

  # -- PMO & Portfolio --
  - name: Greenhouse — PMO & Portfolio Manager
    query: 'site:boards.greenhouse.io "PMO" OR "Portfolio Manager" OR "Release Manager" remote OR "New York" OR "New Jersey"'
    enabled: true

  # -- Contract / C2C / Freelance --
  - name: LinkedIn — Contract PM roles NJ/NY
    query: '"project manager" OR "program manager" OR "scrum master" contract OR "C2C" OR "1099" "New Jersey" OR "New York" remote'
    enabled: true

  - name: Dice — Contract Technical PM
    query: 'site:dice.com "Technical Project Manager" OR "Agile Coach" OR "Scrum Master" contract remote OR "New Jersey"'
    enabled: true

  - name: ClearanceJobs / Gov Contractors — PM
    query: '"program manager" OR "project manager" "SAFe" OR "Agile" government OR federal OR "DOT" OR "DOD" remote OR "New Jersey"'
    enabled: true

  # -- Construction PM (Procore certified) --
  - name: ProCore / Construction PM roles
    query: '"construction project manager" OR "infrastructure project manager" "Procore" OR "PMP" "New Jersey" OR "New York" OR remote'
    enabled: true

